name: "Dev Environment - Up/Down"

# One-click lifecycle of the dev environment.
#   up:   Terraform (VPC/EKS/RDS/Redis) -> EKS add-ons -> namespace + shared resources
#         -> backend services -> CloudFront /api/* origin pointed at the new ALB.
#   down: delete the Ingress (so the controller removes the ALB) -> Terraform teardown.
# Persistent resources (CloudFront, Cognito, S3, KMS, ECR, secrets) are kept in both cases.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up = create the environment, down = tear it down"
        required: true
        type: choice
        options:
          - up
          - down
        default: up

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-environment
  cancel-in-progress: false


jobs:
  # ---------------------------------------------------------------- up
  infra-up:
    if: ${{ inputs.action == 'up' }}
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      target_env: dev
      environment_enabled: true
    secrets: inherit

  eks-setup:
    needs: infra-up
    uses: ./.github/workflows/eks-setup.yml
    with:
      target_env: dev
    secrets: inherit

  create-namespace:
    needs: eks-setup
    uses: miso-proyecto-final-202615-grupo3/solventa-backend/.github/workflows/eks-deploy-base-resources.yml@dev
    with:
      target_env: dev
      action: create_namespace
    secrets: inherit

  create-shared-resources:
    needs: create-namespace
    uses: miso-proyecto-final-202615-grupo3/solventa-backend/.github/workflows/eks-deploy-base-resources.yml@dev
    with:
      target_env: dev
      action: create_shared_resources
    secrets: inherit

  deploy-services:
    needs: create-shared-resources
    uses: miso-proyecto-final-202615-grupo3/solventa-backend/.github/workflows/backend-deploy-eks.yml@dev
    with:
      target_env: dev
    secrets: inherit

  discover-alb:
    needs: deploy-services
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    outputs:
      alb_dns: ${{ steps.alb.outputs.dns }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # The ALB is created by the AWS Load Balancer Controller from the shared Ingress group,
      # so its DNS name changes on every `up`. Wait until it is active and read it.
      - name: Wait for the shared ALB
        id: alb
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            dns=$(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?starts_with(LoadBalancerName, 'k8s-solventasharedalb') && State.Code=='active'].DNSName | [0]" \
              --output text)
            if [ -n "$dns" ] && [ "$dns" != "None" ]; then
              echo "ALB: $dns"
              echo "dns=$dns" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Shared ALB did not become active in time" >&2
          exit 1

  cloudfront-api:
    needs: discover-alb
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      target_env: dev
      environment_enabled: true
      api_origin_domain: ${{ needs.discover-alb.outputs.alb_dns }}
    secrets: inherit

  # -------------------------------------------------------------- down
  delete-ingress:
    if: ${{ inputs.action == 'down' }}
    uses: miso-proyecto-final-202615-grupo3/solventa-backend/.github/workflows/eks-deploy-base-resources.yml@dev
    with:
      target_env: dev
      action: delete_ingress
    secrets: inherit

  wait-alb-deleted:
    needs: delete-ingress
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # The VPC cannot be deleted while the controller-managed ALB and its ENIs still exist.
      - name: Wait until the shared ALB is gone
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            n=$(aws elbv2 describe-load-balancers \
              --query "length(LoadBalancers[?starts_with(LoadBalancerName, 'k8s-solventasharedalb')])" \
              --output text)
            if [ "$n" = "0" ]; then echo "ALB removed"; exit 0; fi
            sleep 15
          done
          echo "ALB still present after waiting" >&2
          exit 1

  infra-down:
    needs: wait-alb-deleted
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      target_env: dev
      environment_enabled: false
    secrets: inherit
