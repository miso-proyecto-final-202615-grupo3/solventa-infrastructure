name: "EKS Cluster - Setup"

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select the environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: "dev"

  workflow_call:
    inputs:
      target_env:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: eks-setup-${{ inputs.target_env }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: solventa-${{ inputs.target_env }}-eks
  CLOUDWATCH_ROLE_NAME: CloudWatchObservabilityIAMRole
  K8S_NAMESPACE: solventa-${{ inputs.target_env }}
  OPENTELEMETRY_COLLECTOR_SA: solventa-otel-collector-sa
  OPENTELEMETRY_ROLE_NAME: OpenTelemetryIAMRole
  ESO_ROLE_NAME: ExternalOperatorIAMRole
  VPC_NAME: solventa-${{ inputs.target_env }}-vpc
  LBC_ROLE_NAME: AWSLoadBalancerControllerIAMRole
  APP_ROLE_NAME: SolventaAppRole
  APP_SERVICE_ACCOUNT: solventa-app-sa

jobs:
  eks-setup:
    name: Setup EKS in ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 60

    env:
      DEPLOYMENT_ENV: ${{ inputs.target_env }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Verify AWS identity and EKS cluster
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --query 'cluster.{name:name,region:region,status:status,endpoint:endpoint}' \
            --output table

      - name: Install AWS Pod Identity Add-on
        shell: bash
        run: |
          set -euo pipefail

          # Check if the addon is already installed and ACTIVE
          ADDON_STATUS=$(aws eks describe-addon \
            --cluster-name "$CLUSTER_NAME" \
            --addon-name eks-pod-identity-agent \
            --query "addon.status" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$ADDON_STATUS" = "ACTIVE" ]; then
            echo "Addon eks-pod-identity-agent is already installed and ACTIVE. Skipping creation."
          else
            aws eks create-addon \
              --cluster-name "$CLUSTER_NAME" \
              --addon-name eks-pod-identity-agent \
              --resolve-conflicts OVERWRITE
            aws eks wait addon-active \
              --cluster-name "$CLUSTER_NAME" \
              --addon-name eks-pod-identity-agent
          fi

      - name: Configure Amazon CloudWatch Observability Pod Identity
        shell: bash
        run: |
          set -euo pipefail

          if ! aws iam get-role --role-name "$CLOUDWATCH_ROLE_NAME" >/dev/null 2>&1; then
            echo "Required IAM role $CLOUDWATCH_ROLE_NAME does not exist. Apply the Terraform module first." >&2
            exit 1
          fi

          CLOUDWATCH_ROLE_ARN="$(aws iam get-role \
            --role-name "$CLOUDWATCH_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)"

          ASSOC_EXISTS=$(aws eks list-pod-identity-associations \
            --cluster-name "$CLUSTER_NAME" \
            --namespace amazon-cloudwatch \
            --service-account cloudwatch-agent \
            --query 'associations[0].associationArn' \
            --output text 2>/dev/null || echo "None")

          if [ "$ASSOC_EXISTS" = "None" ] || [ -z "$ASSOC_EXISTS" ]; then
            aws eks create-pod-identity-association \
              --cluster-name "$CLUSTER_NAME" \
              --namespace amazon-cloudwatch \
              --service-account cloudwatch-agent \
              --role-arn "$CLOUDWATCH_ROLE_ARN"
          else
            echo "Pod Identity Association amazon-cloudwatch-observability already exists. Skipping creation."
          fi

      - name: Configure AWS Distro for OpenTelemetry Pod Identity
        shell: bash
        run: |
          set -euo pipefail

          if ! aws iam get-role --role-name "$OPENTELEMETRY_ROLE_NAME" >/dev/null 2>&1; then
            echo "Required IAM role $OPENTELEMETRY_ROLE_NAME does not exist. Apply the Terraform module first." >&2
            exit 1
          fi

          OPENTELEMETRY_ROLE_ARN="$(aws iam get-role \
            --role-name "$OPENTELEMETRY_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)"

          ASSOC_EXISTS=$(aws eks list-pod-identity-associations \
            --cluster-name "$CLUSTER_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --service-account "$OPENTELEMETRY_COLLECTOR_SA" \
            --query 'associations[0].associationArn' \
            --output text 2>/dev/null || echo "None")

          if [ "$ASSOC_EXISTS" = "None" ] || [ -z "$ASSOC_EXISTS" ]; then
            aws eks create-pod-identity-association \
              --cluster-name "$CLUSTER_NAME" \
              --namespace "$K8S_NAMESPACE" \
              --service-account "$OPENTELEMETRY_COLLECTOR_SA" \
              --role-arn "$OPENTELEMETRY_ROLE_ARN"
          else
            echo "Pod Identity Association adot already exists. Skipping creation."
          fi

      - name: Configure External Secrets Operator Pod Identity
        shell: bash
        run: |
          set -euo pipefail

          if ! aws iam get-role --role-name "$ESO_ROLE_NAME" >/dev/null 2>&1; then
            echo "Required IAM role $ESO_ROLE_NAME does not exist. Apply the Terraform module first." >&2
            exit 1
          fi

          ESO_ROLE_ARN="$(aws iam get-role \
            --role-name "$ESO_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)"

          ASSOC_EXISTS=$(aws eks list-pod-identity-associations \
            --cluster-name "$CLUSTER_NAME" \
            --namespace external-secrets \
            --service-account external-secrets-sa \
            --query 'associations[0].associationArn' \
            --output text 2>/dev/null || echo "None")

          if [ "$ASSOC_EXISTS" = "None" ] || [ -z "$ASSOC_EXISTS" ]; then
            aws eks create-pod-identity-association \
              --cluster-name "$CLUSTER_NAME" \
              --namespace external-secrets \
              --service-account external-secrets-sa \
              --role-arn "$ESO_ROLE_ARN"
          else
            echo "Pod Identity Association external-secrets already exists. Skipping creation."
          fi

      - name: Configure AWS Load Balancer Controller Pod Identity
        shell: bash
        run: |
          set -euo pipefail

          if ! aws iam get-role --role-name "$LBC_ROLE_NAME" >/dev/null 2>&1; then
            echo "Required IAM role $LBC_ROLE_NAME does not exist. Apply the Terraform module first." >&2
            exit 1
          fi

          LBC_ROLE_ARN="$(aws iam get-role \
            --role-name "$LBC_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)"

          ASSOC_EXISTS=$(aws eks list-pod-identity-associations \
            --cluster-name "$CLUSTER_NAME" \
            --namespace kube-system \
            --service-account aws-load-balancer-controller \
            --query 'associations[0].associationArn' \
            --output text 2>/dev/null || echo "None")

          if [ "$ASSOC_EXISTS" = "None" ] || [ -z "$ASSOC_EXISTS" ]; then
            aws eks create-pod-identity-association \
              --cluster-name "$CLUSTER_NAME" \
              --namespace kube-system \
              --service-account aws-load-balancer-controller \
              --role-arn "$LBC_ROLE_ARN"
          else
            echo "Pod Identity Association aws-load-balancer-controller already exists. Skipping creation."
          fi

      - name: Configure Solventa application Pod Identity
        shell: bash
        run: |
          set -euo pipefail

          if ! aws iam get-role --role-name "$APP_ROLE_NAME" >/dev/null 2>&1; then
            echo "Required IAM role $APP_ROLE_NAME does not exist." >&2
            exit 1
          fi

          APP_ROLE_ARN="$(aws iam get-role             --role-name "$APP_ROLE_NAME"             --query 'Role.Arn'             --output text)"

          ASSOC_EXISTS=$(aws eks list-pod-identity-associations             --cluster-name "$CLUSTER_NAME"             --namespace "$K8S_NAMESPACE"             --service-account "$APP_SERVICE_ACCOUNT"             --query 'associations[0].associationArn'             --output text 2>/dev/null || echo "None")

          if [ "$ASSOC_EXISTS" = "None" ] || [ -z "$ASSOC_EXISTS" ]; then
            aws eks create-pod-identity-association               --cluster-name "$CLUSTER_NAME"               --namespace "$K8S_NAMESPACE"               --service-account "$APP_SERVICE_ACCOUNT"               --role-arn "$APP_ROLE_ARN"
          else
            echo "Pod Identity Association solventa-app already exists. Skipping creation."
          fi

      - name: Install Amazon CloudWatch Observability Add-on
        shell: bash
        run: |
          set -euo pipefail

          # Check if the addon is already installed and ACTIVE
          ADDON_STATUS=$(aws eks describe-addon \
            --cluster-name "$CLUSTER_NAME" \
            --addon-name amazon-cloudwatch-observability \
            --query "addon.status" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$ADDON_STATUS" = "ACTIVE" ]; then
            echo "Addon amazon-cloudwatch-observability is already installed and ACTIVE. Skipping creation."
          else
            aws eks create-addon \
              --cluster-name "$CLUSTER_NAME" \
              --addon-name amazon-cloudwatch-observability \
              --resolve-conflicts OVERWRITE
            aws eks wait addon-active \
              --cluster-name "$CLUSTER_NAME" \
              --addon-name amazon-cloudwatch-observability
          fi

      - name: Install cert-manager with Helm
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig --name "$CLUSTER_NAME"

          # helm uninstall cert-manager --namespace cert-manager || true
          # kubectl delete serviceaccount cert-manager --namespace cert-manager --ignore-not-found=true

          helm repo add jetstack https://charts.jetstack.io
          helm repo update

          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --version v1.21.2 \
            --set crds.enabled=true \
            --wait \
            --timeout 10m

      - name: Install AWS Distro for OpenTelemetry Add-on
        shell: bash
        run: |
          set -euo pipefail

          # Check if the addon is already installed and ACTIVE
          ADDON_STATUS=$(aws eks describe-addon \
            --cluster-name "$CLUSTER_NAME" \
            --addon-name adot \
            --query "addon.status" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$ADDON_STATUS" = "ACTIVE" ]; then
            echo "Addon adot is already installed and ACTIVE. Skipping creation."
          else
            aws eks create-addon \
              --cluster-name "$CLUSTER_NAME" \
              --addon-name adot \
              --resolve-conflicts OVERWRITE
            aws eks wait addon-active \
              --cluster-name "$CLUSTER_NAME" \
              --addon-name adot
          fi

      - name: Install External Secrets Operator with Helm
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig --name "$CLUSTER_NAME"

          # helm uninstall external-secrets --namespace external-secrets || true
          # kubectl delete serviceaccount external-secrets-sa--namespace external-secrets --ignore-not-found=true

          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update

          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --set serviceAccount.create=true \
            --set serviceAccount.name=external-secrets-sa \
            --wait \
            --timeout 10m

      - name: Install AWS Load Balancer Controller with Helm
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig --name "$CLUSTER_NAME"

          # kubectl logs -f -n kube-system deployment/aws-load-balancer-controller -c aws-load-balancer-controller

          # helm uninstall aws-load-balancer-controller --namespace kube-system || true
          # kubectl delete serviceaccount aws-load-balancer-controller --namespace kube-system --ignore-not-found=true

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${VPC_NAME}" \
            --query "Vpcs[0].VpcId" \
            --output text)

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" == "None" ]; then
              echo "Error: VPC with name '${VPC_NAME}' not found."
              exit 1
          fi

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --create-namespace \
            --set clusterName="$CLUSTER_NAME" \
            --set enablePodIdentity=true \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=$AWS_REGION \
            --set vpcId=$VPC_ID \
            --wait \
            --timeout 10m

      - name: Verify installed components
        shell: bash
        run: |
          set -euo pipefail

          kubectl get pods -A -l app.kubernetes.io/name=eks-pod-identity-agent \
            --output wide
          kubectl get pods -A -l app.kubernetes.io/name=amazon-cloudwatch-observability \
            --output wide
          kubectl get pods -A -l app.kubernetes.io/name=opentelemetry-operator \
            --output wide
          kubectl get pods -A -l app.kubernetes.io/name=external-secrets \
            --output wide
          kubectl get pods -A -l app.kubernetes.io/name=aws-load-balancer-controller \
            --output wide

          aws eks describe-addon \
            --cluster-name "$CLUSTER_NAME" \
            --addon-name eks-pod-identity-agent \
            --query 'addon.{name:name,status:status,version:version}' \
            --output table
          aws eks describe-addon \
            --cluster-name "$CLUSTER_NAME" \
            --addon-name adot \
            --query 'addon.{name:name,status:status,version:version}' \
            --output table
          aws eks describe-addon \
            --cluster-name "$CLUSTER_NAME" \
            --addon-name amazon-cloudwatch-observability \
            --query 'addon.{name:name,status:status,version:version}' \
            --output table
