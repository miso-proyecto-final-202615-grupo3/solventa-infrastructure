name: "Infra - Terraform Deploy"

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select the environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: "dev"
      env_enabled:
        description: "Deploy network, compute and database resources"
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-deploy-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  terraform-deploy:
    name: Deploy infra to ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 60

    env:
      DEPLOYMENT_ENV: ${{ inputs.target_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Asumir IAM Role via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Ejecutar comandos Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform -chdir=src/environments/$DEPLOYMENT_ENV init \
            -backend-config="bucket=${{ secrets.BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform -chdir=src/environments/$DEPLOYMENT_ENV validate

      - name: Terraform Apply
        env:
          TF_VAR_environment_enabled: ${{ inputs.env_enabled }}
          TF_VAR_rds_database_name: ${{ secrets.RDS_DATABASE_NAME }}
          TF_VAR_rds_master_username: ${{ secrets.RDS_MASTER_USERNAME }}
          TF_VAR_rds_master_password: ${{ secrets.RDS_MASTER_PASSWORD }}
          TF_VAR_redis_auth_token: ${{ secrets.REDIS_AUTH_TOKEN }}
          TF_VAR_eks_cluster_admin_principal_pipeline: ${{ secrets.AWS_ROLE_ARN }}
          TF_VAR_eks_cluster_admin_principal_group: ${{ secrets.EKS_CLUSTER_ADMIN_USER_ARN }}
        run: |
          terraform -chdir=src/environments/$DEPLOYMENT_ENV apply \
            -var-file="../../../config/$DEPLOYMENT_ENV/$DEPLOYMENT_ENV.tfvars" \
            -input=false \
            -auto-approve
